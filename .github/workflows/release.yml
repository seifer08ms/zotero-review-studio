name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-studio-auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("addon/manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'released=true' >> "$GITHUB_OUTPUT"
            echo "$TAG already published, skipping duplicate release."
          else
            echo 'released=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run regression tests
        if: steps.existing.outputs.released != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for test in core runtime exemplar profiles v3 incremental_resume pipeline_equivalence performance chatgpt gap-validation matrix; do
            node "tests/${test}.test.js"
          done

      - name: Build XPI
        if: steps.existing.outputs.released != 'true'
        run: python3 scripts/build_xpi.py

      - name: Generate Zotero update.json
        if: steps.existing.outputs.released != 'true'
        run: python3 scripts/generate_update.py

      - name: Publish versioned GitHub Release
        if: steps.existing.outputs.released != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/zotero-review-studio-${VERSION}.xpi" \
            dist/update.json \
            --target "$GITHUB_SHA" \
            --title "Zotero Review Studio v${VERSION}" \
            --generate-notes
